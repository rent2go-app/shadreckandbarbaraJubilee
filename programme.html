<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programme — Shadreck &amp; Barbara Golden Jubilee</title>
<meta name="description" content="The order of proceedings for the Golden Jubilee of Shadreck and Barbara Nkala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/event-logo.png">
<style>
  body.prog{background:#14110d;color:#f7f1e4;margin:0;overflow:hidden;height:100vh}
  .prog-stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;text-align:center}
  .prog-slide{
    max-width:1500px;width:100%;opacity:0;transform:translateY(16px);
    transition:opacity .8s ease,transform .8s ease
  }
  .prog-slide.in{opacity:1;transform:none}

  .p-num{
    font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;
    color:#7d7263;margin:0 0 2.2rem;font-weight:600
  }
  .p-kicker{
    font-size:clamp(.72rem,1.05vw,1rem);letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold-lt);font-weight:600;margin:0 0 1.6rem
  }
  .p-title{
    font-family:var(--serif);font-weight:600;line-height:1.06;margin:0;
    font-size:clamp(2.4rem,6.4vw,6rem);
    background:linear-gradient(160deg,#f6e6bd,var(--gold-lt),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent
  }
  .p-sub{
    font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.6vw,2.6rem);
    color:#f2e9d6;margin:1.4rem 0 0;line-height:1.3
  }
  .p-rule{width:70px;height:1px;background:rgba(217,185,120,.6);margin:2.4rem auto;position:relative}
  .p-rule::after{
    content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
    transform:translate(-50%,-50%) rotate(45deg);background:var(--gold)
  }
  .p-lines{margin:0;padding:0;list-style:none}
  .p-lines li{
    font-size:clamp(1.05rem,1.9vw,1.9rem);color:#e6dcc6;margin:.5rem 0;line-height:1.4
  }
  .p-lines li.name{
    font-family:var(--serif);font-size:clamp(1.4rem,2.6vw,2.6rem);color:#fff;font-weight:600
  }
  .p-lines li.quiet{font-size:clamp(.9rem,1.3vw,1.25rem);color:#a3987f;font-style:italic}
  .p-crest{width:min(26vh,240px);margin:0 auto 2.4rem;mix-blend-mode:screen}

  /* two-part slides (e.g. two chapters, or prayer + sermon) */
  .p-pair{display:grid;grid-template-columns:1fr 1fr;gap:4vw;margin-top:2.6rem;text-align:center}
  .p-pair .p-kicker{margin-bottom:.9rem}
  .p-pair .p-title{font-size:clamp(1.5rem,3vw,2.7rem)}
  .p-pair .p-sub{font-size:clamp(1rem,1.5vw,1.4rem);margin-top:.7rem}
  @media(max-width:820px){ .p-pair{grid-template-columns:1fr;gap:2.6rem} }

  /* controls */
  .p-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.9rem 1.4rem;z-index:20;
    background:linear-gradient(180deg,transparent,rgba(10,8,6,.85));
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s
  }
  .p-bar.in{opacity:1;visibility:visible}
  .p-bar a,.p-bar button{
    font-family:var(--sans);font-size:.82rem;font-weight:600;letter-spacing:.06em;
    color:var(--gold-lt);background:rgba(20,17,13,.85);text-decoration:none;cursor:pointer;
    border:1px solid rgba(217,185,120,.45);border-radius:999px;padding:.5rem 1.1rem
  }
  .p-bar button:hover,.p-bar a:hover{background:var(--gold);color:#241f19}
  .p-hint{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#7d7263}
  .p-dots{position:fixed;top:0;left:0;right:0;height:3px;display:flex;gap:2px;z-index:20}
  .p-dots i{flex:1;background:rgba(217,185,120,.16)}
  .p-dots i.done{background:var(--gold)}

  /* overview grid — press O */
  .p-overview{
    position:fixed;inset:0;background:rgba(12,10,8,.97);z-index:40;overflow:auto;
    padding:4vh 5vw;display:none
  }
  .p-overview.open{display:block}
  .p-overview h2{
    font-family:var(--serif);color:var(--gold-lt);text-align:center;
    font-size:2rem;margin:0 0 2rem
  }
  .p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
  .p-card{
    text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(217,185,120,.22);
    border-radius:10px;padding:.9rem 1rem;cursor:pointer;color:#e6dcc6;font-family:var(--sans)
  }
  .p-card:hover{border-color:var(--gold);background:rgba(184,137,59,.16)}
  .p-card b{display:block;font-family:var(--serif);font-size:1.1rem;color:#fff;margin-bottom:.2rem}
  .p-card span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#8d8270}
</style>
</head>
<body class="prog">

<div class="p-dots" id="dots"></div>
<div class="prog-stage"><div class="prog-slide" id="slide"></div></div>

<div class="p-bar" id="bar">
  <div style="display:flex;gap:.6rem;align-items:center">
    <a href="index.html">&#10005;&nbsp; Exit</a>
    <button id="btn-overview">Overview</button>
  </div>
  <span class="p-hint" id="pos"></span>
  <div style="display:flex;gap:.6rem;align-items:center">
    <button id="btn-prev">&larr; Back</button>
    <button id="btn-next">Next &rarr;</button>
    <button id="btn-full">Fullscreen</button>
  </div>
</div>

<div class="p-overview" id="overview">
  <h2>Programme &mdash; jump to any moment</h2>
  <div class="p-grid" id="grid"></div>
</div>

<script>
/* ------------------------------------------------------------------
   The order of proceedings, one screen at a time.

   Driven by hand, not on a timer — the MC advances it as the evening
   actually unfolds, because a running order never survives contact
   with a live event. Right arrow / space / click to advance, O for a
   grid of every moment so you can jump if things move around.
------------------------------------------------------------------- */

const SLIDES = [
  { crest:true,
    kicker:'Shadreck &amp; Barbara Nkala',
    title:'Golden Jubilee Celebration',
    sub:'Celebrating 50 Years of Life, Love &amp; Legacy',
    lines:[{t:'&ldquo;We Were 2&hellip; Now We Are Many&rdquo;', c:'quiet'}],
    tag:'Welcome' },

  { kicker:'Arrival',
    title:'Golden Hour Lawn Reception',
    lines:[
      {t:'Welcome Drinks &middot; Canap&eacute;s &middot; Photography'},
      {t:'Live Band &middot; Choral Singers &middot; Traditional Dancers', c:'quiet'}],
    tag:'Reception' },

  { kicker:'eBika &middot; eHaya',
    title:'Ceremonial Proclamation &amp; Grand Entrance',
    sub:'&ldquo;Count Your Blessings&rdquo;',
    lines:[{t:'The Nkala Family Procession', c:'quiet'}],
    tag:'Entrance' },

  { pair:[
      { kicker:'Opening Prayer &amp; Dedication', title:'Bishop Ngulube' },
      { kicker:'Golden Jubilee Sermon',           title:'Bishop Mnkandla' }],
    tag:'Prayer &amp; Sermon' },

  { kicker:'Their Story',
    title:'Chapter One &amp; Two',
    pair:[
      { kicker:'Chapter One', title:'Before We Became Us', sub:'Early Life' },
      { kicker:'Chapter Two', title:'And Then There Were Two', sub:'How They Met' }],
    tag:'Their Story I' },

  { kicker:'Round One',
    title:'Tributes',
    lines:[
      {t:'Alex Nkala &middot; Dumi Nkala', c:'name'},
      {t:'Live Entertainment &mdash; Live Band &middot; Traditional Dancers', c:'quiet'}],
    tag:'Tributes I' },

  { kicker:'Their Story',
    title:'Chapter Three &amp; Four',
    pair:[
      { kicker:'Chapter Three', title:'The Day We Said &ldquo;I Do&rdquo;', sub:'The Wedding' },
      { kicker:'Chapter Four',  title:'We Were Two&hellip; Now We Are Many', sub:'Growing the Family' }],
    tag:'Their Story II' },

  { kicker:'Round Two',
    title:'Tributes',
    lines:[
      {t:'Ntando &amp; Thurston &middot; Ndaba &amp; Tendayi', c:'name'},
      {t:'Live Entertainment &mdash; Live Band &middot; Dancers &middot; Choral Singers', c:'quiet'}],
    tag:'Tributes II' },

  { kicker:'The Next Generation',
    title:'A Golden Rose From Each of Us',
    sub:'A Special Tribute from the Grandchildren',
    lines:[
      {t:'The Final Golden Bouquet', c:'name'},
      {t:'Presented by Thando on behalf of the Grandchildren', c:'quiet'}],
    tag:'Grandchildren' },

  { kicker:'Chapter Five',
    title:'Building a Life Together',
    lines:[{t:'Work &middot; Business &middot; Achievement &middot; Legacy'}],
    tag:'Their Story III' },

  { kicker:'Voices of Love',
    title:'Friends, Church &amp; Extended Family',
    tag:'Voices of Love' },

  { kicker:'Interlude',
    title:'Come &amp; Dance!',
    lines:[{t:'Live Band &middot; Dance Floor'}],
    tag:'Dancing' },

  { kicker:'Chapter Six',
    title:'Walking Into the Sunset Together',
    sub:'&ldquo;The Best Is Yet to Come&rdquo;',
    tag:'Their Story IV' },

  { crest:true,
    kicker:'The Golden Jubilee Moment',
    title:'Shadreck &amp; Barbara',
    lines:[{t:'50 Years &middot; Reflections &middot; Gratitude &middot; Wisdom &middot; The Future', c:'quiet'}],
    tag:'The Couple' },

  { kicker:'Golden Jubilee',
    title:'Cake Ceremony',
    lines:[{t:'Cake Cutting &middot; Anniversary Toast &middot; Celebration Photographs'}],
    tag:'Cake &amp; Toast' },

  { kicker:'Vote of Thanks',
    title:'Ndaba',
    tag:'Vote of Thanks' },

  { kicker:'Marriage &amp; Family Blessing',
    title:'Pastor Jongeni Ncube',
    lines:[{t:'Children &amp; Grandchildren Gather Around Gogo &amp; Khulu', c:'quiet'}],
    tag:'Blessing' },

  { kicker:'And Now&hellip;',
    title:'We Celebrate!',
    lines:[{t:'Live Band &middot; Dancing &middot; Family &middot; Fellowship'}],
    tag:'Celebration' },

  { crest:true,
    title:'Fifty Years. Two Hearts. One Journey.',
    sub:'Many Generations. An Extraordinary Legacy.',
    tag:'Close' }
];

const slideEl = document.getElementById('slide');
const dotsEl  = document.getElementById('dots');
const posEl   = document.getElementById('pos');
let i = 0;

function render(s, n){
  const crest = s.crest ? '<img class="p-crest" src="assets/event-logo.png" alt="">' : '';
  const kicker = s.kicker ? `<p class="p-kicker">${s.kicker}</p>` : '';
  const title  = s.title  ? `<h1 class="p-title">${s.title}</h1>` : '';
  const sub    = s.sub    ? `<p class="p-sub">${s.sub}</p>` : '';
  const lines  = s.lines
    ? `<div class="p-rule"></div><ul class="p-lines">${
        s.lines.map(l => `<li class="${l.c || ''}">${l.t}</li>`).join('')}</ul>`
    : '';
  const pair = s.pair
    ? `<div class="p-pair">${s.pair.map(p => `
        <div>
          ${p.kicker ? `<p class="p-kicker">${p.kicker}</p>` : ''}
          <h2 class="p-title">${p.title}</h2>
          ${p.sub ? `<p class="p-sub">${p.sub}</p>` : ''}
        </div>`).join('')}</div>`
    : '';

  return `<p class="p-num">${String(n + 1).padStart(2,'0')} &nbsp;&middot;&nbsp; ${SLIDES.length}</p>
          ${crest}${kicker}${title}${sub}${lines}${pair}`;
}

function go(n){
  i = (n + SLIDES.length) % SLIDES.length;
  slideEl.classList.remove('in');
  setTimeout(() => {
    slideEl.innerHTML = render(SLIDES[i], i);
    requestAnimationFrame(() => slideEl.classList.add('in'));
    paintDots();
  }, 260);
  /* Deep-link each moment, so the MC can jump straight to one. */
  history.replaceState(null, '', '#' + (i + 1));
}

function paintDots(){
  dotsEl.innerHTML = SLIDES.map((_, n) => `<i class="${n <= i ? 'done' : ''}"></i>`).join('');
  posEl.textContent = `${i + 1} of ${SLIDES.length} — ${SLIDES[i].tag.replace(/&amp;/g,'&')}`;
}

/* ---------- overview ---------- */
const overview = document.getElementById('overview');
document.getElementById('grid').innerHTML = SLIDES.map((s, n) =>
  `<button class="p-card" data-n="${n}"><span>${String(n+1).padStart(2,'0')}</span><b>${s.tag}</b></button>`).join('');
document.getElementById('grid').addEventListener('click', e => {
  const c = e.target.closest('.p-card');
  if (!c) return;
  overview.classList.remove('open');
  go(Number(c.dataset.n));
});
const toggleOverview = () => overview.classList.toggle('open');

/* ---------- controls ---------- */
document.getElementById('btn-next').addEventListener('click', () => go(i + 1));
document.getElementById('btn-prev').addEventListener('click', () => go(i - 1));
document.getElementById('btn-overview').addEventListener('click', toggleOverview);
document.getElementById('btn-full').addEventListener('click', () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); go(i + 1); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp'){ e.preventDefault(); go(i - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End')  go(SLIDES.length - 1);
  if (e.key === 'o' || e.key === 'O') toggleOverview();
  if (e.key === 'f' || e.key === 'F')
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === 'Escape'){
    if (overview.classList.contains('open')) overview.classList.remove('open');
    else if (!document.fullscreenElement) location.href = 'index.html';
  }
});

/* Tap the right side to advance, left side to go back — for a tablet
   on the lectern. Ignores taps on the control bar itself. */
document.querySelector('.prog-stage').addEventListener('click', e => {
  go(e.clientX > window.innerWidth / 2 ? i + 1 : i - 1);
});

/* Controls fade in when anyone touches the machine, then get out of the way. */
const bar = document.getElementById('bar');
let hideBar = null;
function wakeBar(){
  bar.classList.add('in');
  document.body.style.cursor = 'default';
  clearTimeout(hideBar);
  hideBar = setTimeout(() => {
    bar.classList.remove('in');
    if (!overview.classList.contains('open')) document.body.style.cursor = 'none';
  }, 3500);
}
['mousemove','touchstart','click','keydown'].forEach(ev => document.addEventListener(ev, wakeBar));

/* Open at #7 to start on the seventh moment. */
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
wakeBar();
</script>
</body>
</html>
